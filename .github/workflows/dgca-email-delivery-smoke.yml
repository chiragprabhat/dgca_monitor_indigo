name: DGCA email delivery smoke test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SEND ONE TWO-RECIPIENT TEST EMAIL to authorize one synthetic message to both approved recipients
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dgca-email-delivery-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      inputs.confirmation == 'SEND ONE TWO-RECIPIENT TEST EMAIL' &&
      vars.DGCA_MONITOR_ENABLED == 'false' && vars.EMAIL_NOTIFICATIONS_ENABLED == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend/node_api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/node_api/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify Gmail SMTP and send one synthetic message to both recipients
        env:
          DGCA_MONITOR_ENABLED: ${{ vars.DGCA_MONITOR_ENABLED }}
          EMAIL_NOTIFICATIONS_ENABLED: ${{ vars.EMAIL_NOTIFICATIONS_ENABLED }}
          EMAIL_DELIVERY_SMOKE_CONFIRMATION: ${{ inputs.confirmation }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          DEPLOYMENT_TEST_DATABASE_URL: ${{ secrets.DEPLOYMENT_TEST_DATABASE_URL }}
          DEPLOYMENT_TEST_NEON_HOST: ${{ vars.DEPLOYMENT_TEST_NEON_HOST }}
          PRODUCTION_NEON_HOST: ${{ vars.PRODUCTION_NEON_HOST }}
          LOG_LEVEL: warn
        run: node src/scripts/email-delivery-smoke.js
