name: DGCA production database cutover verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification phase
        type: choice
        required: true
        options: [worker, staged, live]
      confirmation:
        description: Enter exactly VERIFY DGCA PRODUCTION WORKER, VERIFY DGCA PRODUCTION STAGE or VERIFY DGCA PRODUCTION LIVE
        type: string
        required: true
      deployment_id:
        description: Approved immutable deployment ID for staged or live mode
        type: string
        required: false
      immutable_host:
        description: Approved generated Vercel hostname for staged or live mode
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: dgca-hosted-job-smoke
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.DGCA_MONITOR_ENABLED == 'false' &&
      vars.EMAIL_NOTIFICATIONS_ENABLED == 'false' &&
      ((inputs.mode == 'worker' && inputs.confirmation == 'VERIFY DGCA PRODUCTION WORKER') ||
      (inputs.mode == 'staged' && inputs.confirmation == 'VERIFY DGCA PRODUCTION STAGE') ||
      (inputs.mode == 'live' && inputs.confirmation == 'VERIFY DGCA PRODUCTION LIVE'))
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: 88d059b531993cd34e05bbf90339faf235c4b356
          path: pinned-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: pinned-app/backend/node_api
      - name: Verify the declared cutover phase with read-only requests
        env:
          CUTOVER_VERIFY_MODE: ${{ inputs.mode }}
          CUTOVER_VERIFY_CONFIRMATION: ${{ inputs.confirmation }}
          CUTOVER_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          CUTOVER_IMMUTABLE_HOST: ${{ inputs.immutable_host }}
          DGCA_MONITOR_ENABLED: ${{ vars.DGCA_MONITOR_ENABLED }}
          EMAIL_NOTIFICATIONS_ENABLED: ${{ vars.EMAIL_NOTIFICATIONS_ENABLED }}
          PRODUCTION_NEON_HOST: ${{ vars.PRODUCTION_NEON_HOST }}
          DEPLOYMENT_TEST_NEON_HOST: ${{ vars.DEPLOYMENT_TEST_NEON_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_PROMOTION_VERIFY_TOKEN: ${{ inputs.mode != 'worker' && secrets.VERCEL_PROMOTION_VERIFY_TOKEN || '' }}
          HOSTED_SMOKE_OPERATOR_USERNAME: ${{ inputs.mode != 'worker' && secrets.HOSTED_SMOKE_OPERATOR_USERNAME || '' }}
          HOSTED_SMOKE_OPERATOR_PASSWORD: ${{ inputs.mode != 'worker' && secrets.HOSTED_SMOKE_OPERATOR_PASSWORD || '' }}
          HOSTED_SMOKE_VERCEL_BYPASS: ${{ inputs.mode == 'staged' && secrets.HOSTED_SMOKE_VERCEL_BYPASS || '' }}
        run: node ops/production-database-cutover.mjs
