name: DGCA background-job smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dgca-background-job-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    if: github.ref == 'refs/heads/main' && vars.DGCA_MONITOR_ENABLED == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend/node_api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/node_api/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Exercise isolated background jobs against deployment-test
        env:
          DGCA_BACKGROUND_SMOKE_NEON: '1'
          DGCA_MONITOR_ENABLED: ${{ vars.DGCA_MONITOR_ENABLED }}
          DEPLOYMENT_TEST_DATABASE_URL: ${{ secrets.DEPLOYMENT_TEST_DATABASE_URL }}
          DEPLOYMENT_TEST_NEON_HOST: ${{ vars.DEPLOYMENT_TEST_NEON_HOST }}
          PRODUCTION_NEON_HOST: ${{ vars.PRODUCTION_NEON_HOST }}
          LOG_LEVEL: warn
        run: node --test test/background-job-smoke.test.js
